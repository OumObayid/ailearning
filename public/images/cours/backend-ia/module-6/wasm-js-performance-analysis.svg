<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="jsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="wasmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" rx="20" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="996" height="556" rx="18" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title Badge -->
  <g transform="translate(40, 35)">
    <rect width="450" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="16" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="1">
      BENCHMARK &amp; PIPELINE : JAVASCRIPT JIT vs WEBASSEMBLY
    </text>
  </g>
  <text x="40" y="95" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900">
    Cycle d'exécution et analyse comparative de latence V8
  </text>
  <text x="40" y="120" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">
    Comprendre le coût de l'interopérabilité (FFI), le préchauffage JIT et la régularité du code machine compilé
  </text>

  <!-- Left: Execution Pipeline Comparison -->
  <g transform="translate(40, 150)">
    <!-- JavaScript Pipeline Card -->
    <rect width="430" height="175" rx="14" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="16" y="16" width="120" height="26" rx="6" fill="#f59e0b" fill-opacity="0.15"/>
    <text x="24" y="34" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">
      PIPELINE JAVASCRIPT
    </text>

    <!-- Pipeline steps -->
    <g transform="translate(20, 58)">
      <!-- Step 1 -->
      <rect x="0" y="0" width="80" height="42" rx="6" fill="#334155"/>
      <text x="40" y="20" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Source</text>
      <text x="40" y="34" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">JS texte</text>

      <path d="M 85 21 L 100 21" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Step 2 -->
      <rect x="105" y="0" width="85" height="42" rx="6" fill="#334155"/>
      <text x="147" y="20" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Ignition</text>
      <text x="147" y="34" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Bytecode</text>

      <path d="M 195 21 L 210 21" stroke="#f59e0b" stroke-width="2"/>

      <!-- Step 3 -->
      <rect x="215" y="0" width="85" height="42" rx="6" fill="#334155"/>
      <text x="257" y="20" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">TurboFan</text>
      <text x="257" y="34" fill="#fbbf24" font-family="sans-serif" font-size="9" font-weight="600" text-anchor="middle">JIT Opt</text>

      <path d="M 305 21 L 320 21" stroke="#f59e0b" stroke-width="2"/>

      <!-- Step 4 -->
      <rect x="325" y="0" width="70" height="42" rx="6" fill="#b45309"/>
      <text x="360" y="26" fill="#ffffff" font-family="monospace" font-size="11" font-weight="800" text-anchor="middle">Machine</text>
    </g>

    <text x="20" y="130" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">
      • Typage dynamique nécessitant profilage à chaud (warm-up)
    </text>
    <text x="20" y="150" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">
      • Risque de dé-optimisation brutale (Deopt) si le type change
    </text>
  </g>

  <!-- Right: WebAssembly Pipeline Card -->
  <g transform="translate(510, 150)">
    <rect width="450" height="175" rx="14" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="16" y="16" width="135" height="26" rx="6" fill="#6366f1" fill-opacity="0.2"/>
    <text x="24" y="34" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">
      PIPELINE WEBASSEMBLY
    </text>

    <!-- Pipeline steps -->
    <g transform="translate(20, 58)">
      <!-- Step 1 -->
      <rect x="0" y="0" width="90" height="42" rx="6" fill="#334155"/>
      <text x="45" y="20" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">C/Rust/Go</text>
      <text x="45" y="34" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">AOT Compile</text>

      <path d="M 95 21 L 115 21" stroke="#6366f1" stroke-width="2"/>

      <!-- Step 2 -->
      <rect x="120" y="0" width="90" height="42" rx="6" fill="#334155"/>
      <text x="165" y="20" fill="#a5b4fc" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">.wasm</text>
      <text x="165" y="34" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Binaire typé</text>

      <path d="M 215 21 L 235 21" stroke="#6366f1" stroke-width="2"/>

      <!-- Step 3 -->
      <rect x="240" y="0" width="85" height="42" rx="6" fill="#334155"/>
      <text x="282" y="20" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Liftoff</text>
      <text x="282" y="34" fill="#a5b4fc" font-family="sans-serif" font-size="9" font-weight="600" text-anchor="middle">Direct Gen</text>

      <path d="M 330 21 L 345 21" stroke="#6366f1" stroke-width="2"/>

      <!-- Step 4 -->
      <rect x="350" y="0" width="70" height="42" rx="6" fill="#4338ca"/>
      <text x="385" y="26" fill="#ffffff" font-family="monospace" font-size="11" font-weight="800" text-anchor="middle">Machine</text>
    </g>

    <text x="20" y="130" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">
      • Typage statique explicite (i32, i64, f32, f64, v128 SIMD)
    </text>
    <text x="20" y="150" fill="#86efac" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">
      • Zéro compilation JIT aléatoire : performance stable et déterministe
    </text>
  </g>

  <!-- Bottom: Data Analysis / Latency Chart -->
  <g transform="translate(40, 350)">
    <rect width="920" height="180" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

    <text x="24" y="30" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">
      TEMPS D'EXÉCUTION SELON LE VOLUME DE DONNÉES (Test Somme 1 à N)
    </text>

    <!-- Test 1: N = 100 (Petite Opération) -->
    <g transform="translate(40, 50)">
      <text x="0" y="16" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">N = 100 (Opération simple)</text>
      <!-- JS Bar -->
      <rect x="0" y="26" width="40" height="18" rx="4" fill="#f59e0b"/>
      <text x="48" y="40" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="700">0.02 ms (JS Gagne : pas de FFI overhead)</text>
      <!-- WASM Bar -->
      <rect x="0" y="50" width="120" height="18" rx="4" fill="#6366f1"/>
      <text x="128" y="64" fill="#a5b4fc" font-family="monospace" font-size="11" font-weight="700">0.08 ms (Coût du pont JS ↔ WASM)</text>
    </g>

    <!-- Test 2: N = 100 Millions (Calcul CPU Intensif) -->
    <g transform="translate(480, 50)">
      <text x="0" y="16" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">N = 100 000 000 (Calcul intensif)</text>
      <!-- JS Bar -->
      <rect x="0" y="26" width="340" height="18" rx="4" fill="#f59e0b"/>
      <text x="350" y="40" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="700">85.4 ms</text>
      <!-- WASM Bar -->
      <rect x="0" y="50" width="155" height="18" rx="4" fill="#6366f1"/>
      <text x="165" y="64" fill="#86efac" font-family="monospace" font-size="11" font-weight="700">38.2 ms (WASM ÷2.23 plus rapide)</text>
    </g>

    <line x1="24" y1="135" x2="896" y2="135" stroke="#334155" stroke-width="1"/>
    <text x="24" y="158" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">
      CONCLUSION TECHNIQUE :
    </text>
    <text x="200" y="158" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">
      Réserver WASM aux calculs lourds, cryptographie, SIMD et filtres où le gain de calcul écrase le coût du pont de liaison FFI.
    </text>
  </g>
</svg>

