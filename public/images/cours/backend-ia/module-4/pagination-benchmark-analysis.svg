<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%" style="background:#ffffff; font-family: Inter, system-ui, sans-serif;">
  <defs>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="425" y="34" text-anchor="middle" font-size="18" font-weight="900" fill="#0f172a">Analyse Comparative de Pagination : LIMIT / OFFSET vs Curseurs</text>
  <text x="425" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">Mesure de la latence SQL en fonction de la profondeur de pagination (1 000 000 de lignes)</text>

  <!-- Graph area -->
  <g transform="translate(80, 90)">
    <!-- Axes and grid -->
    <line x1="50" y1="260" x2="680" y2="260" stroke="#334155" stroke-width="2" />
    <line x1="50" y1="20" x2="50" y2="260" stroke="#334155" stroke-width="2" />

    <!-- Y grid lines -->
    <line x1="50" y1="200" x2="680" y2="200" stroke="#f1f5f9" stroke-width="1.5" />
    <text x="40" y="204" text-anchor="end" font-size="11" font-weight="700" fill="#64748b">100 ms</text>

    <line x1="50" y1="140" x2="680" y2="140" stroke="#f1f5f9" stroke-width="1.5" />
    <text x="40" y="144" text-anchor="end" font-size="11" font-weight="700" fill="#64748b">250 ms</text>

    <line x1="50" y1="80" x2="680" y2="80" stroke="#f1f5f9" stroke-width="1.5" />
    <text x="40" y="84" text-anchor="end" font-size="11" font-weight="700" fill="#64748b">450 ms</text>

    <line x1="50" y1="20" x2="680" y2="20" stroke="#f1f5f9" stroke-width="1.5" />
    <text x="40" y="24" text-anchor="end" font-size="11" font-weight="700" fill="#64748b">600 ms</text>

    <!-- X labels -->
    <text x="70" y="280" font-size="11" font-weight="800" fill="#334155">Page 1</text>
    <text x="210" y="280" font-size="11" font-weight="800" fill="#334155">Page 100</text>
    <text x="360" y="280" font-size="11" font-weight="800" fill="#334155">Page 1 000</text>
    <text x="510" y="280" font-size="11" font-weight="800" fill="#334155">Page 5 000</text>
    <text x="640" y="280" font-size="11" font-weight="800" fill="#334155">Page 10 000</text>

    <!-- Curve 1: OFFSET (Red - Latency explodes as offset grows) -->
    <!-- Points: P1: (70, 258), P100: (230, 252), P1000: (390, 220), P5000: (540, 130), P10000: (660, 35) -->
    <path d="M 70 258 Q 230 252 390 220 T 540 130 T 660 35" fill="none" stroke="#e11d48" stroke-width="4" />
    <circle cx="660" cy="35" r="5" fill="#e11d48" />
    <text x="660" y="25" text-anchor="middle" font-size="11" font-weight="900" fill="#e11d48">580 ms (OFFSET 99 990)</text>

    <!-- Curve 2: Cursor (Green - Constant flat line O(1)) -->
    <!-- Points: all at ~1.2ms (y=257) -->
    <line x1="70" y1="256" x2="660" y2="256" stroke="#059669" stroke-width="4" stroke-dasharray="2,2" />
    <circle cx="660" cy="256" r="5" fill="#059669" />
    <text x="660" y="248" text-anchor="end" font-size="11" font-weight="900" fill="#059669">1.2 ms CONSTANT (Curseur)</text>
  </g>

  <!-- Legend & Insights box -->
  <g transform="translate(70, 395)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="710" height="65" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

    <circle cx="25" cy="22" r="6" fill="#e11d48" />
    <text x="40" y="26" font-size="12" font-weight="800" fill="#9f1239">OFFSET = (page - 1) * limit :</text>
    <text x="240" y="26" font-size="11" font-weight="600" fill="#334155">MySQL doit scanner puis jeter 99 990 lignes en mémoire avant de renvoyer les 10 voulues.</text>

    <circle cx="25" cy="46" r="6" fill="#059669" />
    <text x="40" y="50" font-size="12" font-weight="800" fill="#065f46">Curseur WHERE (created_at, id) &lt; :</text>
    <text x="285" y="50" font-size="11" font-weight="600" fill="#334155">MySQL saute directement au point de reprise grâce au B+Tree : 0 ligne superflue examinée.</text>
  </g>
</svg>
