<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 460" width="100%" height="100%" style="background:#ffffff; font-family: Inter, system-ui, sans-serif;">
  <defs>
    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Title & Context -->
  <text x="425" y="34" text-anchor="middle" font-size="18" font-weight="900" fill="#0f172a">Structure Interne d'un Index B+Tree (Moteur InnoDB)</text>
  <text x="425" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">Organisation hiérarchique équilibrée : 100 000 conversations accessibles en seulement 3 sauts d'I/O</text>

  <!-- Level 1: Root Node -->
  <g filter="url(#shadow)">
    <rect x="325" y="85" width="200" height="52" rx="10" fill="url(#rootGrad)" stroke="#1e1b4b" stroke-width="2" />
    <text x="425" y="108" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">NŒUD RACINE (Page 0)</text>
    <text x="425" y="126" text-anchor="middle" font-size="13" font-weight="900" fill="#fde047">[ user_id &lt; 250 | &lt; 750 | ≥ 750 ]</text>
  </g>

  <!-- Connector Lines L1 to L2 -->
  <path d="M 370 137 L 190 185" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="4,4" />
  <path d="M 425 137 L 425 185" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="4,4" />
  <path d="M 480 137 L 660 185" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="4,4" />

  <!-- Level 2: Intermediate Nodes -->
  <g filter="url(#shadow)">
    <rect x="90" y="185" width="200" height="50" rx="8" fill="url(#nodeGrad)" stroke="#4338ca" stroke-width="2" />
    <text x="190" y="206" text-anchor="middle" font-size="11" font-weight="800" fill="#1e1b4b">NŒUD INTERMÉDIAIRE A</text>
    <text x="190" y="224" text-anchor="middle" font-size="12" font-weight="900" fill="#312e81">[ &lt; 50 | 50..120 | 120..250 ]</text>

    <rect x="325" y="185" width="200" height="50" rx="8" fill="url(#nodeGrad)" stroke="#4338ca" stroke-width="2" />
    <text x="425" y="206" text-anchor="middle" font-size="11" font-weight="800" fill="#1e1b4b">NŒUD INTERMÉDIAIRE B</text>
    <text x="425" y="224" text-anchor="middle" font-size="12" font-weight="900" fill="#312e81">[ 250..450 | 450..600 | 600..750 ]</text>

    <rect x="560" y="185" width="200" height="50" rx="8" fill="url(#nodeGrad)" stroke="#4338ca" stroke-width="2" />
    <text x="660" y="206" text-anchor="middle" font-size="11" font-weight="800" fill="#1e1b4b">NŒUD INTERMÉDIAIRE C</text>
    <text x="660" y="224" text-anchor="middle" font-size="12" font-weight="900" fill="#312e81">[ 750..850 | 850..950 | ≥ 950 ]</text>
  </g>

  <!-- Connector Lines L2 to Leaves -->
  <path d="M 140 235 L 80 285" stroke="#10b981" stroke-width="2" />
  <path d="M 190 235 L 230 285" stroke="#10b981" stroke-width="2" />
  <path d="M 375 235 L 380 285" stroke="#10b981" stroke-width="2" />
  <path d="M 475 235 L 530 285" stroke="#10b981" stroke-width="2" />
  <path d="M 660 235 L 680 285" stroke="#10b981" stroke-width="2" />

  <!-- Level 3: Leaf Nodes (Contain pointers to Clustered Index / PK) -->
  <g filter="url(#shadow)">
    <rect x="25" y="285" width="140" height="65" rx="8" fill="url(#leafGrad)" stroke="#047857" stroke-width="2" />
    <text x="95" y="306" text-anchor="middle" font-size="11" font-weight="900" fill="#064e3b">FEUILLE 1</text>
    <text x="95" y="323" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">user_id: 12 → PK #14</text>
    <text x="95" y="339" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">user_id: 12 → PK #89</text>

    <rect x="180" y="285" width="140" height="65" rx="8" fill="url(#leafGrad)" stroke="#047857" stroke-width="2" />
    <text x="250" y="306" text-anchor="middle" font-size="11" font-weight="900" fill="#064e3b">FEUILLE 2</text>
    <text x="250" y="323" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">user_id: 54 → PK #102</text>
    <text x="250" y="339" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">user_id: 98 → PK #215</text>

    <rect x="335" y="285" width="140" height="65" rx="8" fill="url(#leafGrad)" stroke="#047857" stroke-width="2" />
    <text x="405" y="306" text-anchor="middle" font-size="11" font-weight="900" fill="#064e3b">FEUILLE 3</text>
    <text x="405" y="323" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">user_id: 280 → PK #411</text>
    <text x="405" y="339" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">user_id: 340 → PK #512</text>

    <rect x="490" y="285" width="140" height="65" rx="8" fill="url(#leafGrad)" stroke="#047857" stroke-width="2" />
    <text x="560" y="306" text-anchor="middle" font-size="11" font-weight="900" fill="#064e3b">FEUILLE 4</text>
    <text x="560" y="323" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">user_id: 610 → PK #844</text>
    <text x="560" y="339" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">user_id: 720 → PK #920</text>

    <rect x="645" y="285" width="175" height="65" rx="8" fill="url(#leafGrad)" stroke="#047857" stroke-width="2" />
    <text x="732" y="306" text-anchor="middle" font-size="11" font-weight="900" fill="#064e3b">FEUILLE 5</text>
    <text x="732" y="323" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">user_id: 880 → PK #1024</text>
    <text x="732" y="339" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">user_id: 990 → PK #1150</text>
  </g>

  <!-- Horizontal doubly-linked list between leaves -->
  <path d="M 165 317 L 180 317" stroke="#059669" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M 320 317 L 335 317" stroke="#059669" stroke-width="3" />
  <path d="M 475 317 L 490 317" stroke="#059669" stroke-width="3" />
  <path d="M 630 317 L 645 317" stroke="#059669" stroke-width="3" />

  <!-- Bottom Explanatory Banner -->
  <rect x="25" y="375" width="795" height="65" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="40" y="400" font-size="12" font-weight="800" fill="#0f172a">⚡ Complexité logarithmique O(log N) :</text>
  <text x="40" y="420" font-size="12" font-weight="600" fill="#334155">
    Pour chercher <tspan font-weight="900" fill="#4338ca">WHERE user_id = 12</tspan>, InnoDB lit Racine → Intermédiaire A → Feuille 1 (3 lectures de blocs au lieu de scanner 100 000 lignes).
  </text>
</svg>
