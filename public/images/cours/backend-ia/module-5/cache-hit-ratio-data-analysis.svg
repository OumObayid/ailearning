<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%" style="background:#ffffff; font-family: Inter, system-ui, sans-serif;">
  <defs>
    <linearGradient id="gradHit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gradMiss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadowBox" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="425" y="34" text-anchor="middle" font-size="18" font-weight="900" fill="#0f172a">Analyse des Données d'Impact du Cache Redis sur une API d'IA</text>
  <text x="425" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">Mesure comparative sur 10 000 requêtes d'inférence Gemini (Cache Hit Ratio: 82%)</text>

  <!-- Key Metrics Row -->
  <g transform="translate(35, 85)">
    <!-- Metric 1: Latency -->
    <g filter="url(#shadowBox)">
      <rect x="0" y="0" width="245" height="110" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="20" y="30" font-size="12" font-weight="800" fill="#64748b">LATENCE MOYENNE (P95)</text>
      <text x="20" y="70" font-size="28" font-weight="900" fill="#059669">2.4 ms</text>
      <text x="20" y="95" font-size="11" font-weight="700" fill="#047857">vs 1 850 ms (Sans cache Gemini)</text>
    </g>

    <!-- Metric 2: Cost Reduction -->
    <g filter="url(#shadowBox)">
      <rect x="265" y="0" width="245" height="110" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="285" y="30" font-size="12" font-weight="800" fill="#64748b">RÉDUCTION COÛT TOKENS</text>
      <text x="285" y="70" font-size="28" font-weight="900" fill="#4f46e5">- 82.4%</text>
      <text x="285" y="95" font-size="11" font-weight="700" fill="#4338ca">8 240 appels API évités</text>
    </g>

    <!-- Metric 3: Quota Preservation -->
    <g filter="url(#shadowBox)">
      <rect x="530" y="0" width="250" height="110" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="550" y="30" font-size="12" font-weight="800" fill="#64748b">DÉBIT MAX APPLICATIF</text>
      <text x="550" y="70" font-size="28" font-weight="900" fill="#0f172a">x 120</text>
      <text x="550" y="95" font-size="11" font-weight="700" fill="#334155">Capacité d'accueil utilisateurs</text>
    </g>
  </g>

  <!-- Distribution Chart & Flow Comparison -->
  <g transform="translate(35, 215)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="780" height="180" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

    <text x="25" y="35" font-size="14" font-weight="900" fill="#0f172a">Répartition du Trafic Entrant : Cache Hit vs Cache Miss</text>

    <!-- Bar Chart Visualizing 82% Hit vs 18% Miss -->
    <rect x="25" y="55" width="730" height="28" rx="8" fill="#f1f5f9" />
    <rect x="25" y="55" width="600" height="28" rx="8" fill="url(#gradHit)" />
    <rect x="625" y="55" width="130" height="28" rx="8" fill="url(#gradMiss)" />

    <text x="325" y="74" text-anchor="middle" font-size="12" font-weight="900" fill="#ffffff">8 240 CACHE HITS (82.4%) — Servi depuis Redis RAM (2.4 ms)</text>
    <text x="690" y="74" text-anchor="middle" font-size="11" font-weight="900" fill="#ffffff">MISS (17.6%)</text>

    <!-- Latency Timeline Breakdown -->
    <g transform="translate(25, 105)">
      <rect x="0" y="0" width="350" height="55" rx="8" fill="#ecfdf5" stroke="#10b981" />
      <text x="15" y="24" font-size="11" font-weight="900" fill="#065f46">Scénario Cache HIT (Redis) :</text>
      <text x="15" y="42" font-size="11" font-weight="600" fill="#064e3b">Client $\rightarrow$ Express $\rightarrow$ GET Redis [2 ms] $\rightarrow$ Réponse instantanée</text>

      <rect x="380" y="0" width="350" height="55" rx="8" fill="#fffbeb" stroke="#f59e0b" />
      <text x="395" y="24" font-size="11" font-weight="900" fill="#92400e">Scénario Cache MISS (Inférence Google) :</text>
      <text x="395" y="42" font-size="11" font-weight="600" fill="#78350f">Client $\rightarrow$ Inférence Gemini [1 850 ms] $\rightarrow$ SET Redis TTL $\rightarrow$ Client</text>
    </g>
  </g>

  <!-- Bottom Insight -->
  <rect x="35" y="415" width="780" height="45" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="425" y="442" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">
    💡 Conclusion de l'analyse : Le cache transforme un service bloqué par les quotas API en une infrastructure capable d'absorber des pics viraux.
  </text>
</svg>
